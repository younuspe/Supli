<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Supli</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div id="app">
  <header class="shell-header">
    <div class="brand"><span class="face">◉</span> Supli</div>
    <nav class="menu">
      <button data-menu="File">File</button>
      <button data-menu="View">View</button>
      <button data-menu="Project">Project</button>
      <button data-menu="Stage">Stage</button>
      <button data-menu="AI">AI</button>
      <button data-menu="Tools">Tools</button>
      <button data-menu="Help">Help</button>
    </nav>
    <div class="header-right">
      <select id="project-select" title="Active project"></select>
      <button id="new-project">New Project</button>
    </div>
  </header>

  <div class="toolbar">
    <button id="btn-save" title="Save current file">Save</button>
    <button id="btn-danger" title="Propose the edit as a reviewable diff">Propose Edit</button>
    <button id="btn-plan" title="Build a plan from real files">Plan</button>
    <button id="btn-inspect" title="Inspect the workspace">Inspect</button>
    <button id="btn-recover" title="Run crash recovery">Recover</button>
    <span class="spacer"></span>
    <span id="provider-badge" class="badge">provider: —</span>
    <span id="stage-badge" class="badge">stage: —</span>
    <button id="btn-palette" title="Command palette (Ctrl+K)">⌘K</button>
  </div>

  <main class="layout" id="layout">
    <section class="pane pane-explorer" data-pane="explorer">
      <div class="pane-header">
        PROJECT EXPLORER
        <button class="pane-close" data-close="explorer" title="Close">×</button>
      </div>
      <div class="pane-body"><ul id="file-tree" class="tree"></ul></div>
    </section>

    <section class="pane pane-editor" data-pane="editor">
      <div class="pane-header">
        <span id="editor-title">CODE EDITOR</span>
        <button class="pane-close" data-close="editor" title="Close">×</button>
      </div>
      <div class="pane-body">
        <textarea id="editor" spellcheck="false" placeholder="Open a file from the explorer…"></textarea>
      </div>
    </section>

    <section class="pane pane-chat" data-pane="chat">
      <div class="pane-header">
        SUPLI CHAT
        <button class="pane-close" data-close="chat" title="Close">×</button>
      </div>
      <div class="pane-body">
        <div id="chat-log" class="chat-log"></div>
        <form id="chat-form" class="chat-input">
          <textarea id="chat-text" placeholder="Ask Supli… (Enter to send)" rows="2"></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <section class="dock" id="dock">
    <div class="dock-tabs" id="dock-tabs"></div>
    <div class="dock-body" id="dock-body"></div>
  </section>

  <footer class="statusbar">
    <span id="status-text">Ready.</span>
    <span class="spacer"></span>
    <span id="approval-badge" class="badge hidden">approvals: 0</span>
  </footer>
</div>

<div id="palette" class="palette hidden">
  <input id="palette-input" placeholder="Type a command…" />
  <ul id="palette-list"></ul>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
